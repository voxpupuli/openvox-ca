# golangci-lint v2 configuration for github.com/voxpupuli/openvox-ca.
#
# Curated, high-signal linter set. The goal is a working quality gate that
# passes clean on the current tree, not a zero-finding utopia. Style-only
# linters that would flood the tree with pre-existing nits (revive, gocritic)
# are deliberately left out.
version: "2"

run:
  timeout: 5m

linters:
  # "standard" enables govet, errcheck, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec       # SAST: security problems
    - bodyclose   # HTTP response bodies are closed
    - depguard    # only log/slog may log; see the rule's comment
    - errname     # sentinel errors prefixed Err, error types suffixed Error
    - misspell    # common English misspellings
    - nilerr      # returning nil after a non-nil error check
    - nolintlint  # ill-formed or unexplained nolint directives
    - copyloopvar # loop-variable copy detection (Go 1.22+ semantics)

  settings:
    depguard:
      rules:
        # SECURITY: this rule is one of the two guards behind the CodeQL
        # go/log-injection exclusion in .github/codeql/codeql-config.yml. That
        # query flags every untrusted value reaching a log call, because it
        # models sinks rather than handlers and so cannot see that log/slog's
        # TextHandler and JSONHandler escape control characters in the message,
        # the attribute key, the attribute value, group attributes and slice
        # elements alike. Escaping is why a newline in a certname cannot forge a
        # second log entry here, and it is a property of the *logger*, not of
        # the call sites. cmd/openvox-ca/main_test.go pins that slog escapes;
        # this rule is about what else might end up doing the logging.
        #
        # What it enforces, precisely: no *enumerated* logging library may be
        # imported by non-test code. It is a denylist, not an allowlist -- see
        # the list-mode note below -- so it stops the well-known alternatives
        # from being adopted by accident and cannot prove slog is the only
        # logger. Two cases it structurally cannot see: an unlisted third-party
        # logger, and an slog.Handler implemented in this tree, which needs no
        # import beyond log/slog. AGENTS.md carries the convention in words for
        # exactly those cases; a reviewer weighing a new logging dependency
        # should treat that as part of this guard rather than assume lint has
        # it covered.
        #
        # Each denied package has at least one commonly used output path that
        # writes attacker-supplied bytes through unescaped -- see the individual
        # desc lines, which are deliberately specific, because several of these
        # libraries escape on some paths and not others.
        #
        # Scoped to non-test files: a test that logs through another library is
        # not a production log entry an operator or a log pipeline will read.
        only-slog-logs:
          # "lax" resolves as: allowed unless a deny prefix matches, and a
          # longer allow prefix beats a shorter deny prefix. The allow entry
          # below is doing only that one job -- depguard matches package paths
          # by prefix, so denying "log" also denies "log/slog" under the default
          # "original" mode, which would reject every log/slog import in the
          # tree. Note the consequence: because lax permits anything unlisted,
          # this is a denylist. "strict" would make it an allowlist but would
          # then need every legitimate import in the module enumerated here.
          list-mode: lax
          files:
            - "!$test"
          allow:
            - "log/slog"
          deny:
            - pkg: "log"
              desc: "the standard log package does not escape at all; log through log/slog, whose handlers do"
            - pkg: "github.com/sirupsen/logrus"
              desc: "logrus escapes in its default TextFormatter, but not with DisableQuote or on the coloured TTY path; log through log/slog"
            - pkg: "go.uber.org/zap"
              desc: "zap's console encoder does not escape control characters; log through log/slog"
            - pkg: "github.com/golang/glog"
              desc: "glog does not escape control characters; log through log/slog"
            - pkg: "k8s.io/klog"
              desc: "klog does not escape control characters; log through log/slog"
            # Listed separately because the "log" deny above does not catch it:
            # depguard matches by prefix, and "github.com/go-logr/stdr" does not
            # start with "log" -- yet stdr writes through that very package.
            # (go-logr, logrus and zap are all already indirect dependencies, so
            # none of the three needs a new module to reach for.)
            - pkg: "github.com/go-logr"
              desc: "go-logr's stdr sink writes through the unescaped standard log package; log through log/slog"
            - pkg: "github.com/rs/zerolog"
              desc: "zerolog's ConsoleWriter does not escape control characters; log through log/slog"
            - pkg: "github.com/hashicorp/go-hclog"
              desc: "hclog's default text output does not escape control characters; log through log/slog"
            - pkg: "github.com/charmbracelet/log"
              desc: "charmbracelet/log's text output does not escape control characters; log through log/slog"
            - pkg: "github.com/apex/log"
              desc: "apex/log's text and cli handlers do not escape control characters; log through log/slog"
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      # Secondary Close() errors on the read/cleanup path are idiomatic
      # deliberate-ignores; the primary error (open/read/write) is always
      # returned. Production error-path cleanup in filesystem.go is made
      # explicit with `_ =` instead.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*github.com/voxpupuli/openvox-ca/internal/signer.RemoteSigner).Close
        # Best-effort encode/write directly onto the http.ResponseWriter; once
        # the handler has started writing the body a Write/Encode error is
        # unrecoverable and there is nothing useful to do with it.
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        # Best-effort child-process teardown on the shutdown/error path; the
        # launcher is already exiting or returning the primary error.
        - (*os.Process).Kill
        - (*os.Process).Signal
    gosec:
      # Categorical false-positives confirmed in the security audit. The
      # per-site rules G204/G115/G118 are instead suppressed inline with a
      # specific, explained //nolint:gosec at each call site so the gate stays
      # sensitive to any future genuinely-tainted subprocess or conversion.
      excludes:
        - G401 # SHA1 mandated by RFC 5280 §4.2.1.2 SKI / RFC 6960 OCSP CertID
        - G505 # crypto/sha1 import mandated by RFC 5280 SKI / RFC 6960 CertID
        - G304 # file-backed cert store; paths are operator-config or gated by ValidateSubject + ".." checks
        - G104 # unhandled errors are covered (with line numbers) by errcheck
        - G702 # taint FP: subprocess argv is the operator's own os.Args / ValidateSubject-gated certname (see per-site G204 notes)
        - G705 # taint FP: handlers write DER/PEM certificate bytes to the response, not HTML/JS

  exclusions:
    rules:
      # Tests legitimately ignore Close()/cleanup errors and use weak
      # primitives in fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # QF1008 is an opinionated staticcheck "quick-fix" that flags spelling out
      # an embedded field in a selector (e.g. cfg.StorageConfig.ToBackendSpec).
      # The explicit form is a deliberate, documented style choice in the
      # storage-config code (it makes the embedded source obvious), so we do not
      # enforce the terser form. Scoped to QF1008 only via text match so the
      # rest of staticcheck's checks stay active.
      - linters:
          - staticcheck
        text: "QF1008"

formatters:
  enable:
    - gofmt
