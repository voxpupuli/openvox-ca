# Debian only: shipped by the deb as
# /usr/lib/systemd/system/openvox-ca-first-boot.service.d/00-debian.conf.
#
# The same /etc/default/openvox-ca as openvox-ca.service, because
# OPENVOX_CA_CERTNAME in it is the first tier of the name provisioning mints
# under.
[Service]
EnvironmentFile=-/etc/default/openvox-ca

# And no record-environment. On EL that step records the name in
# /etc/sysconfig/openvox-ca after provisioning; on Debian the package renders
# the same values from debconf at install, so there is nothing to record, and
# the deb does not ship the script. An empty assignment clears the unit's
# ExecStartPost= list, which is how this is decided by the package format
# rather than guessed at runtime from what directories exist.
ExecStartPost=
