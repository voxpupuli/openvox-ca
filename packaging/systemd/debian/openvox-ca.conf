# Debian only: shipped by the deb as
# /usr/lib/systemd/system/openvox-ca.service.d/00-debian.conf.
#
# The install-time values the deb renders from debconf (openvox-ca#251), kept by
# ucf. The EL package records the same two variables in
# /etc/sysconfig/openvox-ca instead, through the line in the unit itself; on
# Debian that file does not exist, and the leading `-` makes it harmless.
[Service]
EnvironmentFile=-/etc/default/openvox-ca
