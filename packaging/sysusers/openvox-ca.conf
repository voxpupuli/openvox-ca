# The account openvox-ca.service and openvox-ca-first-boot.service run as.
#
# `puppet`, not a private `puppet-ca`, and openvox-ca creates it rather than
# depending on anything else having done so -- this host may run neither
# openvox-agent (which creates no account at all and runs as root) nor
# openvox-server (which creates puppet:puppet in its preinst and chowns
# /etc/puppetlabs/puppet/ssl to it). Running as the account that already owns
# that tree fits rather than intrudes.
#
# Divergence from openvox-server's own stanza is tolerable in one direction:
# its preinst runs usermod over an account it finds, so installing Server after
# this repairs the home directory and shell to its own values. It does not
# create a second account, and it does not renumber this one.
#
# Declarative here and applied by systemd-sysusers, which the packages'
# postinstall invokes directly -- because Debian wires no reliable trigger for
# this directory -- and falls back to groupadd/useradd on a host with no
# systemd-sysusers at all. The rpm's preinstall also creates the account with
# groupadd/useradd, before this file is on disk, so the CA directory it
# declares puppet-owned resolves at unpack. All three must create the same
# account; magefile_test.go asserts they do.
g puppet - -
u puppet - "OpenVox Certificate Authority" /etc/puppetlabs/puppet /usr/sbin/nologin
