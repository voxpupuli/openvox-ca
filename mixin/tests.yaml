# promtool rule tests for the CRL-propagation, upstream-chain,
# Kubernetes-export and delayed-supersession alerts.
#
# Run with `mage test:mixin` from the repository root, which renders the mixin
# to the path below and then runs both promtool checks over it.
#
# These cover the rules whose firing behaviour is not obvious from reading the
# PromQL:
#
#   * PuppetCACRLStale, the only expression in the mixin built from set
#     operators (`or`, `unless`, `and on(...)`). Its two arms exist for
#     different failure shapes and the qualifier on the second exists to keep it
#     quiet during a third.
#   * The upstream CRL chain rules, which turn on a timing argument rather than
#     a shape: crlChainWindow must be *twice* crl_chain_refresh_interval_sec, or
#     a persistent fault flaps.
#   * PuppetCAKubernetesExportFailing and PuppetCAKubernetesExportNotRunning,
#     which between them have to cover a target that fails and a target that is
#     never attempted. The first cannot see the second — every arm of it needs a
#     last_error series to match on — so the cases below pin which rule owns
#     which shape, that neither double-pages for the other's, and that a CA not
#     using the feature at all stays silent under both.
#   * PuppetCAOCSPIndexSyncFailing, whose `increase(...)` over the window stays
#     true for the whole window after a single failure — so its `for:` delays
#     the page and then extends it, rather than filtering a transient.
#   * PuppetCASupersedeFailing, where what needs pinning is the debounce: it is
#     deliberately slower than its neighbours because the sweep retries on its
#     own interval, so a case asserts it is quiet at 20m and firing at 40m.
#
# The firing behaviour is the contract here; the annotation prose is not, so
# repeating it below is a maintenance cost rather than an assertion worth
# having. It is repeated anyway because promtool gives no choice: exp_annotations
# is compared whenever a case expects an alert, and omitting it asserts the
# alert carries none. Reword an annotation in alerts.libsonnet and this file has
# to be updated in step.
rule_files:
  # Relative to this file; written by mage test:mixin.
  - ../.test-output/mixin-alerts.yaml

evaluation_interval: 1m

tests:

  # A replica whose cached CRL trails the stored one is stale, and pages once
  # the lag outlives crlLagFor (10m). A gap shorter than that is just the sync
  # interval doing its job after a revocation, and must stay quiet.
  - interval: 1m
    name: cached CRL behind the stored one
    input_series:
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: PuppetCACRLStale
        exp_alerts: []
      - eval_time: 15m
        alertname: PuppetCACRLStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA replica is enforcing an out-of-date CRL."
              description: "The Puppet CA on ca-1:9140 has not caught up with the CRL in storage for more than 10m, so certificates revoked on another replica are still being accepted here. Either it is behind the stored CRL, or the stored CRL cannot be read at all (in which case puppetca_crl_number is absent for this instance). Check puppetca_crl_sync_failures_total and the CA logs. A restart reloads the CRL, selecting the newest block this CA signed; if the stored chain carries none, startup warns and the re-sign paths refuse it, so check the stored chain rather than restarting repeatedly."

  # A replica in step with storage must never fire, however long it runs.
  - interval: 1m
    name: cached CRL level with the stored one
    input_series:
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # The second arm. An unreadable or unparseable stored CRL drops
  # puppetca_crl_number while the cached number keeps being published, so the
  # subtraction has no left operand — without this arm the alert would go silent
  # in one of the two cases it exists for.
  - interval: 1m
    name: stored CRL unreadable while the scrape still succeeds
    input_series:
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PuppetCACRLStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA replica is enforcing an out-of-date CRL."
              description: "The Puppet CA on ca-1:9140 has not caught up with the CRL in storage for more than 10m, so certificates revoked on another replica are still being accepted here. Either it is behind the stored CRL, or the stored CRL cannot be read at all (in which case puppetca_crl_number is absent for this instance). Check puppetca_crl_sync_failures_total and the CA logs. A restart reloads the CRL, selecting the newest block this CA signed; if the stored chain carries none, startup warns and the re-sign paths refuse it, so check the stored chain rather than restarting repeatedly."

  # ...and the qualifier on that arm. A storage outage drops the same series,
  # but is already paged by PuppetCAScrapeFailing, so this must not double-page.
  - interval: 1m
    name: whole gather failing is left to the scrape alert
    input_series:
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # The sync-failure warning is a plain increase() over a restart-resetting
  # counter, but it is meant to lead the page above: crlSyncFor (5m) is shorter
  # than crlLagFor (10m), so at 8m the warning is firing and the critical is not.
  - interval: 1m
    name: sync failures warn before the lag pages
    input_series:
      - series: 'puppetca_crl_sync_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+1x30"
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 8m
        alertname: PuppetCACRLSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA cannot reload its CRL from storage."
              description: "The Puppet CA on ca-1:9140 could not reload the stored CRL (puppetca_crl_sync_failures_total is rising), so it is enforcing whichever CRL it already held. A certificate revoked on another replica may still be accepted here. Check CRL storage, and whether the CA certificate was replaced without restarting this replica."
      - eval_time: 8m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # --- Kubernetes export ---

  # The shape a failed material read now produces. One unreadable CRL fails
  # every target that asked for it, and each of them stamps last_error with no
  # last_success ever recorded, so the 'unless' arm fires once per target.
  #
  # This is the case the exporter used to make impossible: ExportAll returned
  # before the per-target loop when the read failed, so none of these series
  # were written and the rule below had nothing to match. The exporter now
  # records every target on every cycle precisely so this test describes
  # reality.
  - interval: 1m
    name: a failed material read alerts on every target that wanted it
    input_series:
      - series: 'puppetca_k8s_export_last_error_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust"}'
        values: "1000+0x30"
      - series: 'puppetca_k8s_export_last_error_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",kind="ConfigMap",namespace="ns2",name="bundle"}'
        values: "1000+0x30"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust",result="error"}'
        values: "1+1x30"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",kind="ConfigMap",namespace="ns2",name="bundle",result="error"}'
        values: "1+1x30"
    alert_rule_test:
      # k8sExportFailingFor (15m) debounces a failure corrected moments later.
      - eval_time: 10m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              kind: ConfigMap
              namespace: ns2
              name: bundle
            exp_annotations:
              summary: "A Kubernetes export target is failing to apply."
              description: "The most recent apply of ConfigMap/bundle in namespace ns2 from ca-1:9140 failed; the exported object may hold a stale CA certificate or CRL until the next successful export. Check the CA logs, RBAC, and API server connectivity."
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              kind: Secret
              namespace: ns1
              name: trust
            exp_annotations:
              summary: "A Kubernetes export target is failing to apply."
              description: "The most recent apply of Secret/trust in namespace ns1 from ca-1:9140 failed; the exported object may hold a stale CA certificate or CRL until the next successful export. Check the CA logs, RBAC, and API server connectivity."
      # Attempts are being recorded, so this is Failing's business, not
      # NotRunning's. A target that fails every time must not double-page.
      - eval_time: 40m
        alertname: PuppetCAKubernetesExportNotRunning
        exp_alerts: []

  # A CA with no export series at all. Both rules need a series to match on, so
  # neither can fire here — and after the exporter changes that shape means
  # exactly one thing: the feature is not configured on this CA. A configured
  # target always has an applies_total series, published at zero before the
  # first cycle and even when the export fails to start at all, which is what
  # NotRunning above matches.
  #
  # So this asserts silence is correct, not that a gap is tolerated. It is also
  # the guard against closing that gap the wrong way: an `absent()` arm or an
  # `or vector(0)` on either rule would make every CA that does not use the
  # Kubernetes export page for a feature it has not switched on. Both rules are
  # evaluated, because a fix to one that forgot the other would otherwise pass.
  - interval: 1m
    name: a CA not using the export feature is silent
    input_series:
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: PuppetCAKubernetesExportNotRunning
        exp_alerts: []

  # PuppetCAManagedCertificateNeverIssued, whose whole job is a shape no
  # comparison over the leaf series can express: a configured certificate that
  # does not exist. Five cases, because four different things could make it
  # wrong and each would look like the rule working.
  - interval: 1m
    name: a managed certificate that never appears
    input_series:
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local"}'
        values: "1+0x90"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x90"
    alert_rule_test:
      # managedCertNeverIssuedFor (1h) rides out a slow start and the first
      # reconcile interval.
      - eval_time: 30m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []
      - eval_time: 70m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              subject: puppetserver.openvox.svc.cluster.local
            exp_annotations:
              summary: "A managed certificate has never been issued."
              description: "The Puppet CA on ca-1:9140 has puppetserver.openvox.svc.cluster.local configured in managed_certs but no certificate for it exists after 1h. Whatever depends on that certificate has nothing to present. Check the CA logs for the managed-certificate reconcile pass and for the store it writes to -- a Secret refused by RBAC, an unadoptable Secret holding somebody else's material, or a directory that does not exist."

  # The steady state, and the case that stops the rule being a permanent page
  # for every deployment that uses the feature. The leaf series carries serial
  # and state labels the configured series does not, so a rule that tried to
  # match them directly would never cancel and this would fire for ever.
  - interval: 1m
    name: a managed certificate that has been issued is silent
    input_series:
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local"}'
        values: "1+0x90"
      - series: 'puppetca_leaf_certificate_not_after_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local",serial="0a1b",state="signed"}'
        values: "9999999999+0x90"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []

  # Why the expression keeps the target labels instead of matching on subject
  # alone. Two replicas, and only one of them has the entry configured -- the
  # shape a half-applied configuration change makes. `unless on (subject)` would
  # let ca-2's certificate satisfy ca-1's entry and report nothing, which is the
  # opposite of what an operator needs here.
  #
  # The entry is on the replica WITHOUT the certificate, deliberately: with it
  # the other way round the rule passes whatever the matching does, because
  # there is nothing left for the wrong answer to cancel against.
  - interval: 1m
    name: one replica configured, the certificate on the other
    input_series:
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local"}'
        values: "1+0x90"
      - series: 'puppetca_leaf_certificate_not_after_timestamp_seconds{job="openvox-ca",instance="ca-2:9140",subject="puppetserver.openvox.svc.cluster.local",serial="0a1b",state="signed"}'
        values: "9999999999+0x90"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              subject: puppetserver.openvox.svc.cluster.local
            exp_annotations:
              summary: "A managed certificate has never been issued."
              description: "The Puppet CA on ca-1:9140 has puppetserver.openvox.svc.cluster.local configured in managed_certs but no certificate for it exists after 1h. Whatever depends on that certificate has nothing to present. Check the CA logs for the managed-certificate reconcile pass and for the store it writes to -- a Secret refused by RBAC, an unadoptable Secret holding somebody else's material, or a directory that does not exist."

  # The rule's one deliberate deviation from its neighbours, which nothing else
  # pins. All three leaf-expiry rules carry state!="revoked"; this one does not,
  # and its comment says why -- a revoked certificate awaiting reissue is the
  # mechanism working, and the next pass replaces it. Adding state!="revoked"
  # here "for consistency" would page for every normal revoke-then-reissue, and
  # every other case in this file would stay green.
  - interval: 1m
    name: a managed certificate awaiting reissue after revocation is silent
    input_series:
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local"}'
        values: "1+0x90"
      - series: 'puppetca_leaf_certificate_not_after_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local",serial="0a1b",state="revoked"}'
        values: "9999999999+0x90"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []

  # The one shape the rule's own two sides disagree about, and the reason the
  # expression is qualified on a successful scrape.
  #
  # The configured series is built from the in-process configuration and is
  # published even when the gather fails; the leaf series are read from storage
  # and all vanish together. So a storage outage leaves the left side of the
  # `unless` standing with nothing on the right, and every configured entry
  # matches -- healthy ones included. Without the qualifier this fires an hour
  # into an outage PuppetCAScrapeFailing has already been paging for, and sends
  # an operator to check RBAC for certificates that exist and are fine.
  #
  # Both certificates here are healthy and present up to the outage: the series
  # stop at 40m, which is what a gather failure looks like to Prometheus, and
  # scrape_success goes to 0 at the same moment. The assertion is silence at
  # 110m, more than managedCertNeverIssuedFor past the failure.
  - interval: 1m
    name: a storage outage does not page for every managed certificate
    input_series:
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local"}'
        values: "1+0x120"
      - series: 'puppetca_managed_certificate_configured{job="openvox-ca",instance="ca-1:9140",subject="puppetdb.openvox.svc.cluster.local"}'
        values: "1+0x120"
      - series: 'puppetca_leaf_certificate_not_after_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",subject="puppetserver.openvox.svc.cluster.local",serial="0a1b",state="signed"}'
        values: "9999999999+0x40"
      - series: 'puppetca_leaf_certificate_not_after_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",subject="puppetdb.openvox.svc.cluster.local",serial="0a1c",state="signed"}'
        values: "9999999999+0x40"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x40 0+0x80"
    alert_rule_test:
      # Healthy, before the outage.
      - eval_time: 30m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []
      # Well past managedCertNeverIssuedFor into the outage: still silent,
      # because the gather is failing rather than the certificates missing.
      - eval_time: 110m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []

  # A CA not using the feature. The configured series is published from the
  # configuration, so its absence means exactly one thing: no managed
  # certificate is configured. This is the guard against closing the gap the
  # wrong way -- an `absent()` arm or an `or vector(0)` would page every
  # deployment that has not switched the feature on.
  - interval: 1m
    name: a CA with no managed certificates is silent
    input_series:
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: PuppetCAManagedCertificateNeverIssued
        exp_alerts: []

  # The backstop. The CA creates the apply counters at zero for every configured
  # target before the first cycle, so a target that is configured but never
  # attempted is a series sitting at zero — something PromQL can match — rather
  # than an absence, which it cannot.
  - interval: 1m
    name: a configured target that is never attempted
    input_series:
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust",result="success"}'
        values: "0+0x60"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust",result="error"}'
        values: "0+0x60"
    alert_rule_test:
      # k8sExportNotRunningFor (30m) rides out a slow start.
      - eval_time: 20m
        alertname: PuppetCAKubernetesExportNotRunning
        exp_alerts: []
      - eval_time: 40m
        alertname: PuppetCAKubernetesExportNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              kind: Secret
              namespace: ns1
              name: trust
            exp_annotations:
              summary: "A Kubernetes export target has never been attempted."
              description: "The Puppet CA on ca-1:9140 has Secret/trust in namespace ns1 configured for export but has not attempted a single apply in 30m. The exported object holds whatever it held before, and PuppetCAKubernetesExportFailing cannot report on a target with no apply results. Check the CA logs for the Kubernetes export job starting, and for errors initialising the in-cluster client."
      # Nothing has failed, only nothing has happened, so Failing stays quiet.
      - eval_time: 40m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts: []

  # A target that succeeded and then failed: the '>' arm, and the proof that a
  # later success clears it. The two-minute retry the exporter runs after a failed
  # cycle is what produces the second half of this timeline on a quiet CA, where
  # the next CRL update could be weeks away.
  - interval: 1m
    name: a failure that a retry later clears
    input_series:
      # Fails at t=0, then a retry succeeds at t=25m with a newer timestamp.
      - series: 'puppetca_k8s_export_last_error_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust"}'
        values: "1000+0x60"
      - series: 'puppetca_k8s_export_last_success_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust"}'
        values: "900+0x24 2000+0x36"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",kind="Secret",namespace="ns1",name="trust",result="error"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              kind: Secret
              namespace: ns1
              name: trust
            exp_annotations:
              summary: "A Kubernetes export target is failing to apply."
              description: "The most recent apply of Secret/trust in namespace ns1 from ca-1:9140 failed; the exported object may hold a stale CA certificate or CRL until the next successful export. Check the CA logs, RBAC, and API server connectivity."
      # The retry succeeded; last_success now leads and the alert resolves.
      - eval_time: 30m
        alertname: PuppetCAKubernetesExportFailing
        exp_alerts: []

  # Deployment-added labels must not be aggregated away. Under the shipped
  # ServiceMonitor (honorLabels: false) Prometheus renames the exporter's
  # `namespace` to `exported_namespace`, so two targets that differ only by
  # export namespace -- the documented way to publish one trust bundle into
  # several -- carry identical job/instance/kind/name. A `by` allowlist naming
  # `namespace` would group them together and let the attempted one hide the
  # never-attempted one; `without (result)` keeps them apart.
  - interval: 1m
    name: a sibling target does not mask a never-attempted one
    input_series:
      # ns1 is being exported normally.
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",namespace="pki",exported_namespace="ns1",kind="Secret",name="trust",result="success"}'
        values: "5+0x60"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",namespace="pki",exported_namespace="ns1",kind="Secret",name="trust",result="error"}'
        values: "0+0x60"
      # ns2 is configured and has never been attempted.
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",namespace="pki",exported_namespace="ns2",kind="Secret",name="trust",result="success"}'
        values: "0+0x60"
      - series: 'puppetca_k8s_export_applies_total{job="openvox-ca",instance="ca-1:9140",namespace="pki",exported_namespace="ns2",kind="Secret",name="trust",result="error"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: PuppetCAKubernetesExportNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              namespace: pki
              exported_namespace: ns2
              kind: Secret
              name: trust
            exp_annotations:
              summary: "A Kubernetes export target has never been attempted."
              description: "The Puppet CA on ca-1:9140 has Secret/trust in namespace pki configured for export but has not attempted a single apply in 30m. The exported object holds whatever it held before, and PuppetCAKubernetesExportFailing cannot report on a target with no apply results. Check the CA logs for the Kubernetes export job starting, and for errors initialising the in-cluster client."

  # The OCSP index sync failure warning. Its dwell (ocspIndexSyncFor, 15m) is
  # deliberately longer than the CRL one's, because a missed inventory read is
  # not fail-open and a single transient failure should not page — so this
  # checks both sides of that: quiet at 8m, firing at 20m.
  - interval: 1m
    name: OCSP index sync failures page only after the longer dwell
    input_series:
      - series: 'puppetca_ocsp_index_sync_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+1x40"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: PuppetCAOCSPIndexSyncFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: PuppetCAOCSPIndexSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA cannot reload its OCSP serial index from storage."
              description: "The Puppet CA on ca-1:9140 could not reload the inventory into its OCSP serial index (puppetca_ocsp_index_sync_failures_total is rising), so it is answering \"unknown\" for certificates its peers have signed since the last successful pass. Check inventory storage, and the inventory integrity MAC if the logs report a mismatch."

  # One failure and then nothing: the alert still fires, because increase() over
  # the window stays true until the window rolls past the step. This pins the
  # latching behaviour the config comment describes — a `for` cannot debounce
  # this expression, and a reader who assumed it could would size the knobs
  # wrongly. It is also the only case that constrains ocspIndexSyncWindow at all
  # — case 1's counter rises every step, so any window over a couple of minutes
  # satisfies it. The single step is at t=0 and the assertion is at t=35m, so
  # increase() sees it only while the window exceeds 35m: any value of 35m or
  # less fails here.
  - interval: 1m
    name: OCSP index sync latches after a single failure
    input_series:
      - series: 'puppetca_ocsp_index_sync_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+0x40"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: PuppetCAOCSPIndexSyncFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: PuppetCAOCSPIndexSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA cannot reload its OCSP serial index from storage."
              description: "The Puppet CA on ca-1:9140 could not reload the inventory into its OCSP serial index (puppetca_ocsp_index_sync_failures_total is rising), so it is answering \"unknown\" for certificates its peers have signed since the last successful pass. Check inventory storage, and the inventory integrity MAC if the logs report a mismatch."

  # A replica whose index reads are all succeeding must not appear, or the rule
  # would page on every healthy CA in the fleet.
  - interval: 1m
    name: OCSP index sync quiet when reads succeed
    input_series:
      - series: 'puppetca_ocsp_index_sync_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x40"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: PuppetCAOCSPIndexSyncFailing
        exp_alerts: []

  # A delayed revocation the CA could not schedule or carry out. The counter is
  # in-process and independent of the CRL series, so this must fire on its own —
  # a supersession that was never recorded never touches the CRL, and asserting
  # the CRL alert stays quiet is what stops the two being conflated.
  #
  # Debounced for 30m, so it is quiet at 20m and firing at 40m. Without the
  # first assertion a rule that alerted instantly would still pass.
  - interval: 1m
    name: supersede failures warn once debounced
    input_series:
      - series: 'puppetca_supersede_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+1x60"
      - series: 'puppetca_crl_update_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x60"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: PuppetCASupersedeFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: PuppetCASupersedeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA is failing to revoke superseded certificates."
              description: "The Puppet CA on ca-1:9140 could not schedule or carry out the revocation of a certificate a renewal replaced (puppetca_supersede_failures_total is rising), so that certificate is still a valid credential. Check the CA logs to tell the causes apart: \"Superseded-certificate revocation sweep failed\" means the sweep could not read the list, take the CRL lock or write the list back, which is the likeliest cause and blocks every pending revocation at once; \"failed to retire replaced certificate\" means the supersession was never recorded and the serial is in the warning; \"Could not revoke superseded certificates\" means they were recorded but the sweep could not amend the CRL; it re-signs once for the whole pass, so every entry that pass attempted stays listed and is retried together; \"Discarding\" means the entry is gone and will never be retried. A store that cannot serve the superseded key raises this even where the overlap window is closed (superseded_cert_revoke_after_sec: 0) — look for \"cannot determine supersession status\" or \"Revoke: could not read pending supersessions\", which also mean renewals are being refused. Retire anything the sweep will not with openvox-ca-ctl revoke --serial <hex>. puppetca_supersede_pending shows how many are still waiting."
      - eval_time: 40m
        alertname: PuppetCACRLUpdateFailing
        exp_alerts: []

  # PuppetCACRLUpdateFailing. Its expression is a plain increase() and needs no
  # pinning, but this branch rewrote its description — it quotes CA log lines,
  # and the renaming of "failed to revoke replaced certificate" to "failed to
  # retire replaced certificate" had to be propagated here. A test over the
  # annotation is what stops the next rename leaving the runbook pointing at a
  # string the code no longer emits, which is silent: the alert still fires,
  # and the operator greps for nothing.
  #
  # Debounced for 15m, so quiet at 10m and firing at 20m.
  - interval: 1m
    name: CRL update failures warn once debounced
    input_series:
      - series: 'puppetca_crl_update_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+1x40"
      - series: 'puppetca_supersede_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x40"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCACRLUpdateFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: PuppetCACRLUpdateFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA is failing to update its CRL."
              description: "The Puppet CA on ca-1:9140 could not amend its CRL (puppetca_crl_update_failures_total is rising). Revocations may not have taken effect and superseded certificates may still be valid. Check the CA logs to tell the causes apart: \"Renew:\"/\"AutoRenew:\"/\"ReconcileManaged: failed to retire replaced certificate\"/\"Clean:\" warnings are a real failure to maintain the CRL, and on filesystem or SQLite a \"Revoke failed\" warning on a request that took over a minute is instead a revocation that merely queued too long for its subject lock. The superseded-certificate sweep re-signs once per pass rather than once per due entry, so a failing sweep moves this counter once however many certificates were due: read a rising value as a count of failed CRL amendments, not of certificates left unrevoked, and use puppetca_supersede_pending for those. Then check CRL storage."
      - eval_time: 20m
        alertname: PuppetCASupersedeFailing
        exp_alerts: []

  # --- Upstream CRL chain ---

  # The chain window is twice crl_chain_refresh_interval_sec, and that ratio is
  # a timing argument rather than a preference: at exactly one interval a
  # persistent fault flaps. Consecutive increments sit one window apart, so the
  # last sample carrying the older value ages out of the range before the next
  # increment lands, increase() reads 0 for a scrape or two, the alert resolves
  # and its `for` restarts from zero. This drives a fault that increments once
  # an hour and asserts the alert is still firing three hours in, which is where
  # a window equal to the interval would have gone quiet at least twice.
  - interval: 1m
    name: a persistent chain-refresh fault does not flap
    input_series:
      - series: 'puppetca_crl_chain_refresh_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x59 1+0x59 2+0x59 3+0x59"
    alert_rule_test:
      # Before the first increment. The counter exists and reads 0, which is the
      # healthy state an alert on increase() must stay quiet through -- and the
      # state a rule written on the raw counter rather than its increase would
      # not.
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts: []
      - eval_time: 119m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "The Puppet CA cannot refresh its upstream CRL chain."
              description: "Refreshing crl_chain_file on ca-1:9140 is failing, so the published ancestor CRLs are ageing with nothing renewing them. The existing chain is left in place; check the file is readable, parseable, ends on a PEM block boundary, and is under 4 MiB. Note this also blocks revocation until it is fixed."
      - eval_time: 179m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "The Puppet CA cannot refresh its upstream CRL chain."
              description: "Refreshing crl_chain_file on ca-1:9140 is failing, so the published ancestor CRLs are ageing with nothing renewing them. The existing chain is left in place; check the file is readable, parseable, ends on a PEM block boundary, and is under 4 MiB. Note this also blocks revocation until it is fixed."

  # The other half of the same rule: it must also stop. increase() over a window
  # is self-resolving only if the window really does age the step out, so a fault
  # that is fixed has to fall silent without anyone acknowledging anything.
  # Asserting only that it fires cannot tell a working alert from one latched on
  # a counter that never descends.
  - interval: 1m
    name: a chain-refresh fault that stops resolves on its own
    input_series:
      # One failure at ten minutes, then nothing further for four hours.
      - series: 'puppetca_crl_chain_refresh_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x9 1+0x240"
    alert_rule_test:
      # Fired: the increment is inside the 2h window and the 15m debounce has
      # passed.
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "The Puppet CA cannot refresh its upstream CRL chain."
              description: "Refreshing crl_chain_file on ca-1:9140 is failing, so the published ancestor CRLs are ageing with nothing renewing them. The existing chain is left in place; check the file is readable, parseable, ends on a PEM block boundary, and is under 4 MiB. Note this also blocks revocation until it is fixed."
      # Resolved: the increment has aged out of the window, and nothing replaced
      # it. A rule keyed on the counter's value rather than its increase would
      # still be firing here, for ever.
      - eval_time: 240m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts: []

  # PuppetCAUpstreamCRLDiscarded: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL discarded once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_discarded_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "ca-1:9140 dropped a CRL from crl_chain_file because no certificate in its CA bundle signed it, so the published chain is smaller than the file says. Check that the file holds CRLs from this CA's own ancestors and that the bundle is complete. If the file is stale rather than the bundle incomplete, PuppetCAUpstreamCRLRegressed is the alert for that."
              summary: "The Puppet CA is discarding CRLs from crl_chain_file."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []

  # PuppetCAUpstreamCRLRegressed: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL regressed once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_regressed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "crl_chain_file on ca-1:9140 carries an upstream CRL older than the one already published, so it was passed over and the newer one kept. Revocation is unaffected. The file is stale, rolled back or being replayed: check whatever refreshes it. If the ancestor legitimately restarted its CRL numbering (a CA rebuilt from backup, still using the same key), drop it from the file for one publish cycle and then add the new CRL back -- with nothing published to compare against, it is accepted. Publishing the older list would have un-revoked, fleet-wide, everything that ancestor revoked in between."
              summary: "The Puppet CA is being offered stale upstream CRLs."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []

  # PuppetCAUpstreamCRLRemoved: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL removed once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_removed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "An ancestor CRL has been dropped from the published chain on ca-1:9140. The file is authoritative, so this is honoured -- and it cannot be undone here, because this CA cannot re-sign another CA's list. There are two ways to reach this. Either the file stopped listing the ancestor -- check whatever writes it, since a glob that matched one file fewer produces exactly this -- or the ancestor's own certificate has left the stored CA bundle, so nothing signs its CRL any more and it can no longer be published; the log line says which, and the second is fixed by re-importing the bundle rather than by touching the file. Agents on the default certificate_revocation = chain will stop seeing anything that ancestor revoked. Act on this when you see it rather than waiting: the removal is a single event, so this alert clears after the window closes even though the ancestor stays dropped, a restart zeroes the counter, and that ancestor's own expiry series has simply vanished. Nothing afterwards distinguishes the shrunken chain from a correct one."
              summary: "The Puppet CA has dropped an ancestor CRL from its published chain."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []

  # PuppetCAUpstreamCRLNeverRead: zero means never read, which is a
  # configuration fault rather than a stale one -- distinct from the refresh
  # alert, which needs a read to have succeeded at least once.
  - interval: 1m
    name: a chain file that has never been read alerts, and stops once it is
    input_series:
      - series: 'puppetca_crl_chain_last_read_timestamp_seconds{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x40 1000+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              description: "crl_chain_file is set on ca-1:9140 but has never been opened -- a wrong path, or a Secret that never mounted. The feature is doing nothing, and because an absent file is treated as \"no statement\" rather than an error, nothing else reports it. Note this does not catch a subPath mount: that reads successfully forever, so it looks healthy here and shows up as PuppetCAUpstreamCRLExpiringSoon instead."
              summary: "The Puppet CA has never read its configured crl_chain_file."
      - eval_time: 70m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts: []

  # The two upstream expiry alerts turn on time(), so the case has to bracket
  # a boundary rather than assert one side of it: a rule off by the window would
  # still fire eventually, and a case that only checks "fires" passes. The
  # boundary this one brackets is the fourteen-day warning threshold. The other
  # boundary -- nextUpdate itself, where the two rules hand over -- is the case
  # below, and neither of these two reaches it.
  - interval: 1m
    name: an upstream CRL crosses into the expiry window and then expires
    input_series:
      - series: 'puppetca_crl_chain_next_update_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "1216800x400"
    alert_rule_test:
      # Still more than fourteen days out, so neither rule has anything to say.
      - eval_time: 1h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []
      # Past the boundary, and past the 1h debounce.
      - eval_time: 4h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 reaches NextUpdate in 13d 22h 0m 0s. openvox-ca cannot reissue it: refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA is approaching its NextUpdate."
      # Expiring-soon is scoped to CRLs that have not yet expired, so it must
      # hand over rather than fire alongside the expired rule.
      - eval_time: 4h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts: []

  - interval: 1m
    name: an expired upstream CRL pages and stops being merely expiring
    input_series:
      # nextUpdate in the past for the whole window.
      - series: 'puppetca_crl_chain_next_update_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "1x400"
    alert_rule_test:
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts: []
      - eval_time: 2h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 is past its NextUpdate. Agents using the default certificate_revocation = chain will fail verification against the whole chain. Refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA has expired."
      - eval_time: 2h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []

  # The handover at nextUpdate itself, which neither case above reaches: one
  # holds the series far from zero for the whole window and the other starts
  # already past it, so both only ever evaluate one side. ExpiringSoon is
  # "> 0" and Expired is "<= 0", so the instant nextUpdate == time() belongs to
  # exactly one of them -- and an off-by-one in either comparator is a double
  # page or a silent gap at precisely the moment the pair exists for, with every
  # other case still green.
  - interval: 1m
    name: the upstream expiry alerts hand over at nextUpdate itself
    input_series:
      # Constant, so nextUpdate - time() falls through zero at exactly 6h.
      - series: 'puppetca_crl_chain_next_update_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "21600x600"
    alert_rule_test:
      # An hour out: still the warning's side of the boundary, and firing.
      - eval_time: 5h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 reaches NextUpdate in 1h 0m 0s. openvox-ca cannot reissue it: refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA is approaching its NextUpdate."
      - eval_time: 5h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts: []
      # Exactly at nextUpdate, and this is the assertion the pair turns on:
      # ExpiringSoon requires "> 0", so it must stop here. With ">= 0" it would
      # still be firing, its condition having held continuously since the start
      # of the window, and it would page alongside the critical below.
      - eval_time: 6h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []
      # One debounce later the critical is up. Expired's condition becomes true
      # at 6h exactly, so "for: 1h" puts its first firing at 7h on the dot; with
      # "< 0" instead of "<= 0" it would not become true until the next sample
      # and this would still be pending, leaving the gap the handover exists to
      # close.
      - eval_time: 7h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 is past its NextUpdate. Agents using the default certificate_revocation = chain will fail verification against the whole chain. Refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA has expired."
      - eval_time: 7h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []

  # The flap guard for PuppetCAUpstreamCRLDiscarded, mirroring the one on
  # PuppetCAUpstreamCRLRefreshFailing above. All four chain-health rules share
  # the `increase(...[crlChainWindow]) > 0` shape and the same window/for pair,
  # but only RefreshFailing was driven by a *recurring* fault. The sibling cases
  # drive a single increment, which proves fire-then-resolve and cannot
  # distinguish a window that holds a persistent fault continuously from one
  # that lets it flap. That distinction is the whole reason crlChainWindow is
  # twice crl_chain_refresh_interval_sec rather than equal to it, and a later
  # edit binding one rule to a narrower window would pass every existing case.
  #
  # A fault recurring once an hour, asserted still firing three hours in --
  # where a window equal to the interval would already have gone quiet twice.
  - interval: 1m
    name: a persistent discarded fault does not flap
    input_series:
      - series: 'puppetca_crl_chain_discarded_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x59 1+0x59 2+0x59 3+0x59"
    alert_rule_test:
      # Quiet while the counter exists and reads 0.
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []
      - eval_time: 119m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "ca-1:9140 dropped a CRL from crl_chain_file because no certificate in its CA bundle signed it, so the published chain is smaller than the file says. Check that the file holds CRLs from this CA's own ancestors and that the bundle is complete. If the file is stale rather than the bundle incomplete, PuppetCAUpstreamCRLRegressed is the alert for that."
              summary: "The Puppet CA is discarding CRLs from crl_chain_file."
      - eval_time: 179m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "ca-1:9140 dropped a CRL from crl_chain_file because no certificate in its CA bundle signed it, so the published chain is smaller than the file says. Check that the file holds CRLs from this CA's own ancestors and that the bundle is complete. If the file is stale rather than the bundle incomplete, PuppetCAUpstreamCRLRegressed is the alert for that."
              summary: "The Puppet CA is discarding CRLs from crl_chain_file."

  # The flap guard for PuppetCAUpstreamCRLRegressed, mirroring the one on
  # PuppetCAUpstreamCRLRefreshFailing above. All four chain-health rules share
  # the `increase(...[crlChainWindow]) > 0` shape and the same window/for pair,
  # but only RefreshFailing was driven by a *recurring* fault. The sibling cases
  # drive a single increment, which proves fire-then-resolve and cannot
  # distinguish a window that holds a persistent fault continuously from one
  # that lets it flap. That distinction is the whole reason crlChainWindow is
  # twice crl_chain_refresh_interval_sec rather than equal to it, and a later
  # edit binding one rule to a narrower window would pass every existing case.
  #
  # A fault recurring once an hour, asserted still firing three hours in --
  # where a window equal to the interval would already have gone quiet twice.
  - interval: 1m
    name: a persistent regressed fault does not flap
    input_series:
      - series: 'puppetca_crl_chain_regressed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x59 1+0x59 2+0x59 3+0x59"
    alert_rule_test:
      # Quiet while the counter exists and reads 0.
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []
      - eval_time: 119m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "crl_chain_file on ca-1:9140 carries an upstream CRL older than the one already published, so it was passed over and the newer one kept. Revocation is unaffected. The file is stale, rolled back or being replayed: check whatever refreshes it. If the ancestor legitimately restarted its CRL numbering (a CA rebuilt from backup, still using the same key), drop it from the file for one publish cycle and then add the new CRL back -- with nothing published to compare against, it is accepted. Publishing the older list would have un-revoked, fleet-wide, everything that ancestor revoked in between."
              summary: "The Puppet CA is being offered stale upstream CRLs."
      - eval_time: 179m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "crl_chain_file on ca-1:9140 carries an upstream CRL older than the one already published, so it was passed over and the newer one kept. Revocation is unaffected. The file is stale, rolled back or being replayed: check whatever refreshes it. If the ancestor legitimately restarted its CRL numbering (a CA rebuilt from backup, still using the same key), drop it from the file for one publish cycle and then add the new CRL back -- with nothing published to compare against, it is accepted. Publishing the older list would have un-revoked, fleet-wide, everything that ancestor revoked in between."
              summary: "The Puppet CA is being offered stale upstream CRLs."

  # The flap guard for PuppetCAUpstreamCRLRemoved, mirroring the one on
  # PuppetCAUpstreamCRLRefreshFailing above. All four chain-health rules share
  # the `increase(...[crlChainWindow]) > 0` shape and the same window/for pair,
  # but only RefreshFailing was driven by a *recurring* fault. The sibling cases
  # drive a single increment, which proves fire-then-resolve and cannot
  # distinguish a window that holds a persistent fault continuously from one
  # that lets it flap. That distinction is the whole reason crlChainWindow is
  # twice crl_chain_refresh_interval_sec rather than equal to it, and a later
  # edit binding one rule to a narrower window would pass every existing case.
  #
  # A fault recurring once an hour, asserted still firing three hours in --
  # where a window equal to the interval would already have gone quiet twice.
  - interval: 1m
    name: a persistent removed fault does not flap
    input_series:
      - series: 'puppetca_crl_chain_removed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x59 1+0x59 2+0x59 3+0x59"
    alert_rule_test:
      # Quiet while the counter exists and reads 0.
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []
      - eval_time: 119m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "An ancestor CRL has been dropped from the published chain on ca-1:9140. The file is authoritative, so this is honoured -- and it cannot be undone here, because this CA cannot re-sign another CA's list. There are two ways to reach this. Either the file stopped listing the ancestor -- check whatever writes it, since a glob that matched one file fewer produces exactly this -- or the ancestor's own certificate has left the stored CA bundle, so nothing signs its CRL any more and it can no longer be published; the log line says which, and the second is fixed by re-importing the bundle rather than by touching the file. Agents on the default certificate_revocation = chain will stop seeing anything that ancestor revoked. Act on this when you see it rather than waiting: the removal is a single event, so this alert clears after the window closes even though the ancestor stays dropped, a restart zeroes the counter, and that ancestor's own expiry series has simply vanished. Nothing afterwards distinguishes the shrunken chain from a correct one."
              summary: "The Puppet CA has dropped an ancestor CRL from its published chain."
      - eval_time: 179m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "An ancestor CRL has been dropped from the published chain on ca-1:9140. The file is authoritative, so this is honoured -- and it cannot be undone here, because this CA cannot re-sign another CA's list. There are two ways to reach this. Either the file stopped listing the ancestor -- check whatever writes it, since a glob that matched one file fewer produces exactly this -- or the ancestor's own certificate has left the stored CA bundle, so nothing signs its CRL any more and it can no longer be published; the log line says which, and the second is fixed by re-importing the bundle rather than by touching the file. Agents on the default certificate_revocation = chain will stop seeing anything that ancestor revoked. Act on this when you see it rather than waiting: the removal is a single event, so this alert clears after the window closes even though the ancestor stays dropped, a restart zeroes the counter, and that ancestor's own expiry series has simply vanished. Nothing afterwards distinguishes the shrunken chain from a correct one."
              summary: "The Puppet CA has dropped an ancestor CRL from its published chain."

  # Every chain-health rule must stay silent on a CA that never configured
  # crl_chain_file. The counters and the last-read gauge are exported only where
  # the feature is on, so silence here is the absence of the series rather than
  # a zero -- and PuppetCAUpstreamCRLNeverRead is the rule that makes that
  # fragile, because "never read" and "not configured" both look like nothing.
  #
  # This is the guard against closing that gap the wrong way: an `absent()` arm
  # or an `or vector(0)` on any of these would page every CA in the fleet for a
  # feature it has not switched on. All five are evaluated, because a fix to one
  # that forgot the others would otherwise pass. Mirrors "a CA not using the
  # export feature is silent" above, which exists for the same reason.
  - interval: 1m
    name: a CA not publishing an upstream chain is silent
    input_series:
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []
      - eval_time: 60m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []
      - eval_time: 60m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []
      - eval_time: 60m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts: []

  # --- Client trust domains ---

  # --- Client trust domains ---

  # --- Client trust domains ---

  # The client-CRL rules. Three failure modes an operator must act on
  # differently, and the boundary each turns on is a number in config.libsonnet
  # that reading the PromQL will not settle.
  - interval: 1m
    name: a trust domain with no usable CRL pages, but not before the debounce
    input_series:
      - series: 'puppetca_client_crl_usable{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+0x30"
    alert_rule_test:
      # Under `for`, so pending rather than firing: a reload in progress must
      # not page.
      - eval_time: 5m
        alertname: PuppetCAClientCRLUnusable
        exp_alerts: []
      - eval_time: 11m
        alertname: PuppetCAClientCRLUnusable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "A Puppet CA client trust domain has no usable CRL."
              description: "client_ca server on ca-1:9140 holds no currently valid CRL at all — every CRL expired, every one was discarded as unverifiable, or every one was discarded as partial-scope (a delta CRL, or one scoped to an issuing distribution point, which lists only a fraction of what its issuer has revoked). Under client_revocation_policy=require every client of that issuer is rejected. Refresh its crl_file from the issuing CA, and if the delivery was recently changed check the server log for discard warnings — a full CRL is required here, since this CA is handed a file and fetches no distribution points. Note this fires only on total loss: a domain holding one anchor's CRL and not another's reads healthy here, and shows up as PuppetCAClientCRLRefusals instead."

  - interval: 1m
    name: a domain whose crl_file stopped being applied goes stale, not before
    input_series:
      # The gauge holds the timestamp of the last successful apply, so a domain
      # that never applies again leaves it fixed while time() runs on.
      - series: 'puppetca_client_crl_last_reload_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+0x240"
    alert_rule_test:
      # clientCRLStaleSeconds is three refresh passes at the 1h default, so two
      # hours of staleness is a missed pass and not yet a fault.
      - eval_time: 2h
        alertname: PuppetCAClientCRLStale
        exp_alerts: []
      - eval_time: 3h20m
        alertname: PuppetCAClientCRLStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "The Puppet CA has stopped applying a trust domain's crl_file."
              description: "crl_file for client_ca server on ca-1:9140 has not been applied for 3h 20m 0s. The previous CRLs are still in use and still current, so nothing else reports a problem -- but revocations published since are not being honoured. Check the server log for a reload error, or for a reload refused because it would have covered fewer anchors than the set in use, dropped an enforced partial CRL, moved an anchor backwards to an older CRL, or could not be shown to be newer at all because this server will not date the CRLs it holds for that anchor -- check this server's clock and the issuer's."

  - interval: 1m
    name: refusals stop paging once they stop happening
    input_series:
      # Refusals for the first twenty minutes, then none. Event-driven, so the
      # rule must fall silent on its own once the cause is fixed rather than
      # latching -- the counter never goes down.
      - series: 'puppetca_client_crl_refusals_total{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+1x20 21+0x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: PuppetCAClientCRLRefusals
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "The Puppet CA is refusing clients of a trust domain for want of a CRL."
              description: "client_ca server on ca-1:9140 is refusing clients because revocation information was missing: an issuer in their chain has no currently valid CRL, or the presented certificate is itself one of the entry's anchors, which nothing can attest to. Unlike the gauge this is a fact rather than an estimate: these are requests that were turned away. The usual cause is an anchor whose CRL is missing or expired while the entry's other anchors are fine, or an entry anchored on a shared root whose intermediates cannot have their CRLs verified — see the crl_file notes in the configuration guide."
      # An hour and the debounce after the last refusal, the window has emptied.
      - eval_time: 2h
        alertname: PuppetCAClientCRLRefusals
        exp_alerts: []
