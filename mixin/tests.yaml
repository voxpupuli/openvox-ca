# promtool rule tests for the CRL-propagation alerts.
#
# Run with `mage test:mixin` from the repository root, which renders the mixin
# to the path below and then runs both promtool checks over it.
#
# What is covered here is the properties that reading the PromQL does not settle,
# rather than the rule set as a whole. PuppetCACRLStale's expression is the only one in the mixin built
# from set operators (`or`, `unless`, `and on(...)`): its two arms exist for
# different failure shapes, and the qualifier on the second exists to keep it
# quiet during a third. The upstream-chain case covers a timing argument instead
# -- that crlChainWindow must be *twice* crl_chain_refresh_interval_sec, or a
# persistent fault flaps.
#
# The firing behaviour is the contract here; the annotation prose is not, so
# repeating it below is a maintenance cost rather than an assertion worth
# having. It is repeated anyway because promtool gives no choice: exp_annotations
# is compared whenever a case expects an alert, and omitting it asserts the
# alert carries none. Reword an annotation in alerts.libsonnet and this file has
# to be updated in step.
rule_files:
  # Relative to this file; written by mage test:mixin.
  - ../.test-output/mixin-alerts.yaml

evaluation_interval: 1m

tests:
  # A replica whose cached CRL trails the stored one is stale, and pages once
  # the lag outlives crlLagFor (10m). A gap shorter than that is just the sync
  # interval doing its job after a revocation, and must stay quiet.
  - interval: 1m
    name: cached CRL behind the stored one
    input_series:
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: PuppetCACRLStale
        exp_alerts: []
      - eval_time: 15m
        alertname: PuppetCACRLStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA replica is enforcing an out-of-date CRL."
              description: "The Puppet CA on ca-1:9140 has not caught up with the CRL in storage for more than 10m, so certificates revoked on another replica are still being accepted here. Either it is behind the stored CRL, or the stored CRL cannot be read at all (in which case puppetca_crl_number is absent for this instance). Check puppetca_crl_sync_failures_total and the CA logs. A restart reloads the CRL, selecting the newest block this CA signed; if the stored chain carries none, startup warns and the re-sign paths refuse it, so check the stored chain rather than restarting repeatedly."

  # A replica in step with storage must never fire, however long it runs.
  - interval: 1m
    name: cached CRL level with the stored one
    input_series:
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # The second arm. An unreadable or unparseable stored CRL drops
  # puppetca_crl_number while the cached number keeps being published, so the
  # subtraction has no left operand — without this arm the alert would go silent
  # in one of the two cases it exists for.
  - interval: 1m
    name: stored CRL unreadable while the scrape still succeeds
    input_series:
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PuppetCACRLStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA replica is enforcing an out-of-date CRL."
              description: "The Puppet CA on ca-1:9140 has not caught up with the CRL in storage for more than 10m, so certificates revoked on another replica are still being accepted here. Either it is behind the stored CRL, or the stored CRL cannot be read at all (in which case puppetca_crl_number is absent for this instance). Check puppetca_crl_sync_failures_total and the CA logs. A restart reloads the CRL, selecting the newest block this CA signed; if the stored chain carries none, startup warns and the re-sign paths refuse it, so check the stored chain rather than restarting repeatedly."

  # ...and the qualifier on that arm. A storage outage drops the same series,
  # but is already paged by PuppetCAScrapeFailing, so this must not double-page.
  - interval: 1m
    name: whole gather failing is left to the scrape alert
    input_series:
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # The sync-failure warning is a plain increase() over a restart-resetting
  # counter, but it is meant to lead the page above: crlSyncFor (5m) is shorter
  # than crlLagFor (10m), so at 8m the warning is firing and the critical is not.
  - interval: 1m
    name: sync failures warn before the lag pages
    input_series:
      - series: 'puppetca_crl_sync_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0 1+1x30"
      - series: 'puppetca_crl_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "7+0x30"
      - series: 'puppetca_crl_cached_number{job="openvox-ca",instance="ca-1:9140"}'
        values: "6+0x30"
      - series: 'puppetca_collector_scrape_success{job="openvox-ca",instance="ca-1:9140"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 8m
        alertname: PuppetCACRLSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "Puppet CA cannot reload its CRL from storage."
              description: "The Puppet CA on ca-1:9140 could not reload the stored CRL (puppetca_crl_sync_failures_total is rising), so it is enforcing whichever CRL it already held. A certificate revoked on another replica may still be accepted here. Check CRL storage, and whether the CA certificate was replaced without restarting this replica."
      - eval_time: 8m
        alertname: PuppetCACRLStale
        exp_alerts: []

  # The chain window is twice crl_chain_refresh_interval_sec, and that ratio is
  # a timing argument rather than a preference: at exactly one interval a
  # persistent fault flaps. Consecutive increments sit one window apart, so the
  # last sample carrying the older value ages out of the range before the next
  # increment lands, increase() reads 0 for a scrape or two, the alert resolves
  # and its `for` restarts from zero. This drives a fault that increments once
  # an hour and asserts the alert is still firing three hours in, which is where
  # a window equal to the interval would have gone quiet at least twice.
  - interval: 1m
    name: a persistent chain-refresh fault does not flap
    input_series:
      - series: 'puppetca_crl_chain_refresh_failures_total{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x59 1+0x59 2+0x59 3+0x59"
    alert_rule_test:
      - eval_time: 119m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "The Puppet CA cannot refresh its upstream CRL chain."
              description: "Refreshing crl_chain_file on ca-1:9140 is failing, so the published ancestor CRLs are ageing with nothing renewing them. The existing chain is left in place; check the file is readable, parseable, ends on a PEM block boundary, and is under 4 MiB. Note this also blocks revocation until it is fixed."
      - eval_time: 179m
        alertname: PuppetCAUpstreamCRLRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              summary: "The Puppet CA cannot refresh its upstream CRL chain."
              description: "Refreshing crl_chain_file on ca-1:9140 is failing, so the published ancestor CRLs are ageing with nothing renewing them. The existing chain is left in place; check the file is readable, parseable, ends on a PEM block boundary, and is under 4 MiB. Note this also blocks revocation until it is fixed."

  # PuppetCAUpstreamCRLDiscarded: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL discarded once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_discarded_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "ca-1:9140 dropped a CRL from crl_chain_file because no certificate in its CA bundle signed it, so the published chain is smaller than the file says. Check that the file holds CRLs from this CA's own ancestors and that the bundle is complete. If the file is stale rather than the bundle incomplete, PuppetCAUpstreamCRLRegressed is the alert for that."
              summary: "The Puppet CA is discarding CRLs from crl_chain_file."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLDiscarded
        exp_alerts: []

  # PuppetCAUpstreamCRLRegressed: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL regressed once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_regressed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "crl_chain_file on ca-1:9140 carries an upstream CRL older than the one already published, so it was passed over and the newer one kept. Revocation is unaffected. The file is stale, rolled back or being replayed: check whatever refreshes it. If the ancestor legitimately restarted its CRL numbering (a CA rebuilt from backup, still using the same key), drop it from the file for one publish cycle and then add the new CRL back -- with nothing published to compare against, it is accepted. Publishing the older list would have un-revoked, fleet-wide, everything that ancestor revoked in between."
              summary: "The Puppet CA is being offered stale upstream CRLs."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLRegressed
        exp_alerts: []

  # PuppetCAUpstreamCRLRemoved: event-driven, so it must fall silent once the cause stops
  # rather than latching on a counter that never descends.
  - interval: 1m
    name: an upstream CRL removed once stops alerting when it stops happening
    input_series:
      - series: 'puppetca_crl_chain_removed_total{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "0+0x5 1+0x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "An ancestor CRL has been dropped from the published chain on ca-1:9140. The file is authoritative, so this is honoured -- and it cannot be undone here, because this CA cannot re-sign another CA's list. There are two ways to reach this. Either the file stopped listing the ancestor -- check whatever writes it, since a glob that matched one file fewer produces exactly this -- or the ancestor's own certificate has left the stored CA bundle, so nothing signs its CRL any more and it can no longer be published; the log line says which, and the second is fixed by re-importing the bundle rather than by touching the file. Agents on the default certificate_revocation = chain will stop seeing anything that ancestor revoked. Act on this when you see it rather than waiting: the removal is a single event, so this alert clears after the window closes even though the ancestor stays dropped, a restart zeroes the counter, and that ancestor's own expiry series has simply vanished. Nothing afterwards distinguishes the shrunken chain from a correct one."
              summary: "The Puppet CA has dropped an ancestor CRL from its published chain."
      - eval_time: 3h
        alertname: PuppetCAUpstreamCRLRemoved
        exp_alerts: []

  # PuppetCAUpstreamCRLNeverRead: zero means never read, which is a
  # configuration fault rather than a stale one -- distinct from the refresh
  # alert, which needs a read to have succeeded at least once.
  - interval: 1m
    name: a chain file that has never been read alerts, and stops once it is
    input_series:
      - series: 'puppetca_crl_chain_last_read_timestamp_seconds{job="openvox-ca",instance="ca-1:9140"}'
        values: "0+0x40 1000+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts: []
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
            exp_annotations:
              description: "crl_chain_file is set on ca-1:9140 but has never been opened -- a wrong path, or a Secret that never mounted. The feature is doing nothing, and because an absent file is treated as \"no statement\" rather than an error, nothing else reports it. Note this does not catch a subPath mount: that reads successfully forever, so it looks healthy here and shows up as PuppetCAUpstreamCRLExpiringSoon instead."
              summary: "The Puppet CA has never read its configured crl_chain_file."
      - eval_time: 70m
        alertname: PuppetCAUpstreamCRLNeverRead
        exp_alerts: []

  # The two upstream expiry alerts turn on time(), so the case has to bracket
  # the boundary rather than assert one side of it: a rule off by the window
  # would still fire eventually, and a case that only checks "fires" passes.
  - interval: 1m
    name: an upstream CRL crosses into the expiry window and then expires
    input_series:
      - series: 'puppetca_crl_chain_next_update_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "1216800x400"
    alert_rule_test:
      # Still more than fourteen days out, so neither rule has anything to say.
      - eval_time: 1h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []
      # Past the boundary, and past the 1h debounce.
      - eval_time: 4h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 reaches NextUpdate in 13d 22h 0m 0s. openvox-ca cannot reissue it: refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA is approaching its NextUpdate."
      # Expiring-soon is scoped to CRLs that have not yet expired, so it must
      # hand over rather than fire alongside the expired rule.
      - eval_time: 4h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts: []

  - interval: 1m
    name: an expired upstream CRL pages and stops being merely expiring
    input_series:
      # nextUpdate in the past for the whole window.
      - series: 'puppetca_crl_chain_next_update_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",issuer="Upstream Root CA"}'
        values: "1x400"
    alert_rule_test:
      - eval_time: 30m
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts: []
      - eval_time: 2h
        alertname: PuppetCAUpstreamCRLExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              issuer: Upstream Root CA
            exp_annotations:
              description: "The CRL issued by Upstream Root CA and republished by ca-1:9140 is past its NextUpdate. Agents using the default certificate_revocation = chain will fail verification against the whole chain. Refresh crl_chain_file from the issuing CA."
              summary: "An upstream CRL published by the Puppet CA has expired."
      - eval_time: 2h
        alertname: PuppetCAUpstreamCRLExpiringSoon
        exp_alerts: []

  # The client-CRL rules. Three failure modes an operator must act on
  # differently, and the boundary each turns on is a number in config.libsonnet
  # that reading the PromQL will not settle.
  - interval: 1m
    name: a trust domain with no usable CRL pages, but not before the debounce
    input_series:
      - series: 'puppetca_client_crl_usable{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+0x30"
    alert_rule_test:
      # Under `for`, so pending rather than firing: a reload in progress must
      # not page.
      - eval_time: 5m
        alertname: PuppetCAClientCRLUnusable
        exp_alerts: []
      - eval_time: 11m
        alertname: PuppetCAClientCRLUnusable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "A Puppet CA client trust domain has no usable CRL."
              description: "client_ca server on ca-1:9140 holds no currently valid CRL at all — every CRL expired, every one was discarded as unverifiable, or every one was discarded as partial-scope (a delta CRL, or one scoped to an issuing distribution point, which lists only a fraction of what its issuer has revoked). Under client_revocation_policy=require every client of that issuer is rejected. Refresh its crl_file from the issuing CA, and if the delivery was recently changed check the server log for discard warnings — a full CRL is required here, since this CA is handed a file and fetches no distribution points. Note this fires only on total loss: a domain holding one anchor's CRL and not another's reads healthy here, and shows up as PuppetCAClientCRLRefusals instead."

  - interval: 1m
    name: a domain whose crl_file stopped being applied goes stale, not before
    input_series:
      # The gauge holds the timestamp of the last successful apply, so a domain
      # that never applies again leaves it fixed while time() runs on.
      - series: 'puppetca_client_crl_last_reload_timestamp_seconds{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+0x240"
    alert_rule_test:
      # clientCRLStaleSeconds is three refresh passes at the 1h default, so two
      # hours of staleness is a missed pass and not yet a fault.
      - eval_time: 2h
        alertname: PuppetCAClientCRLStale
        exp_alerts: []
      - eval_time: 3h20m
        alertname: PuppetCAClientCRLStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "The Puppet CA has stopped applying a trust domain's crl_file."
              description: "crl_file for client_ca server on ca-1:9140 has not been applied for 3h 20m 0s. The previous CRLs are still in use and still current, so nothing else reports a problem -- but revocations published since are not being honoured. Check the server log for a reload error, or for a reload refused because it would have covered fewer anchors than the set in use, dropped an enforced partial CRL, or moved an anchor backwards to an older CRL."

  - interval: 1m
    name: refusals stop paging once they stop happening
    input_series:
      # Refusals for the first twenty minutes, then none. Event-driven, so the
      # rule must fall silent on its own once the cause is fixed rather than
      # latching -- the counter never goes down.
      - series: 'puppetca_client_crl_refusals_total{job="openvox-ca",instance="ca-1:9140",client_ca="server"}'
        values: "0+1x20 21+0x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: PuppetCAClientCRLRefusals
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openvox-ca
              instance: ca-1:9140
              client_ca: server
            exp_annotations:
              summary: "The Puppet CA is refusing clients of a trust domain for want of a CRL."
              description: "client_ca server on ca-1:9140 is refusing clients because revocation information was missing: an issuer in their chain has no currently valid CRL, or the presented certificate is itself one of the entry's anchors, which nothing can attest to. Unlike the gauge this is a fact rather than an estimate: these are requests that were turned away. The usual cause is an anchor whose CRL is missing or expired while the entry's other anchors are fine, or an entry anchored on a shared root whose intermediates cannot have their CRLs verified — see the crl_file notes in the configuration guide."
      # An hour and the debounce after the last refusal, the window has emptied.
      - eval_time: 2h
        alertname: PuppetCAClientCRLRefusals
        exp_alerts: []
