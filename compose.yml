# Compose deployment for openvox-ca using the published container images.
#
# Quick start:
#   docker compose up -d        (or: podman-compose up -d)
#
# CA state lives in the named volume `ca-ssl`, so it survives container
# restarts and image upgrades. On first run a new CA is bootstrapped under
# /etc/puppetlabs/puppet/ssl/ca, and it issues its own serving certificate,
# for the names `puppet` and `localhost`, beside it on the same volume: the
# configuration baked into the image asks for that. An agent left at its
# default server name, `puppet`, verifies it as it stands, and the CA's
# signing key stays out of the network-facing process.
#
# To serve another name, or to configure anything else, mount your own file
# over /etc/openvox-ca/config.yaml (the commented line under `volumes:`). It
# replaces the baked one entirely. See "Running" in docs/container-images.md.
#
# See docs/container-images.md for the available image tags, and
# docs/configuration.md for the full configuration reference (mTLS,
# storage backends, autosigning, ...).
#
# The compose topologies used by the integration test suites live under
# test/ (test/compose*.yml); they are not deployment examples.

name: openvox-ca

services:
  openvox-ca:
    # `:latest` is deliberately left unpinned so this example tracks the
    # newest release, but a floating tag carries no supply-chain integrity
    # guarantee: two pulls at different times can yield different images.
    # Pin a release tag (e.g. :1.2.3) or a digest for production
    # deployments. This is the distroless image; an `-alpine` variant of
    # every tag, with a shell, is also published. Both run as uid 65532, so
    # data written by a container that ran as another uid has to be re-owned
    # to 65532:65532 first (docs/container-images.md, "Runtime user").
    image: ghcr.io/voxpupuli/openvox-ca:latest
    # No `command:`: the image's own runs the CA from the volume below. A
    # command here replaces it, so restate --cadir if you add one.
    # NOTE: autosign is off by default. Only enable it in dev/test
    # environments: it lets any CSR submitter obtain a signed certificate
    # without operator review.
    ports:
      - "8140:8140"
    volumes:
      - ca-ssl:/etc/puppetlabs/puppet/ssl
      # - ./config.yaml:/etc/openvox-ca/config.yaml:ro
    restart: unless-stopped
    # No healthcheck here: every image variant declares its own, `openvox-ca
    # healthcheck`. Images released before it (v1.0.0-alpha1 and earlier)
    # declare none. See "Health check" in docs/container-images.md.

volumes:
  ca-ssl:
