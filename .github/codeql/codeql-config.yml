name: "openvox-ca CodeQL config"

# Query filters applied on top of the query suite selected in
# .github/workflows/codeql.yml. That workflow's `queries: security-and-quality`
# input is deliberately left alone: without a `+` prefix the input replaces a
# config file's `queries:` key, but `query-filters` is a separate key and is
# unaffected, so coverage is not narrowed by this file. Only the one rule named
# below stops being reported.

query-filters:
  # go/log-injection reports every untrusted value that reaches a log call --
  # certnames off the request path, serials, r.URL.Path, decoded JSON bodies.
  # Thirty-eight of these were dismissed by hand as false positives before this
  # exclusion; the 39th would have been dismissed for the same reason, which is
  # the argument for saying it once, here, instead.
  #
  # They are false positives for one uniform reason. The query models log
  # *sinks* and cannot see what a handler does with the bytes: its only
  # recognised sanitisers are strings.ReplaceAll against "\n"/"\r" and the %q
  # verb, neither of which suits structured logging. This project logs only
  # through log/slog, whose TextHandler and JSONHandler escape control
  # characters in the message, the attribute key, the attribute value, group
  # attributes and slice elements alike -- so a newline in a certname renders
  # as the two characters \ and n and cannot forge a second entry. That is a
  # modelling gap in the query, not a judgement call about any one call site.
  #
  # SECURITY: an exclusion is only as good as the invariant it rests on, and
  # excluding a rule is silent where a dismissal is at least visible. Two guards
  # keep this one honest, and a reviewer should treat their removal as removing
  # this exclusion too:
  #
  #   1. .golangci.yml, depguard rule `only-slog-logs` -- denies the known
  #      logging libraries whose text output passes control characters through,
  #      so the common ways to adopt an unescaped logger fail lint. Read its
  #      comment before relying on it: it is a denylist, so an unlisted library
  #      or an slog.Handler implemented in this tree would pass. AGENTS.md
  #      carries the convention in words for those cases.
  #   2. cmd/openvox-ca/main_test.go, "control characters in logged data cannot
  #      forge a second entry" -- pins that both handlers setupLogger installs
  #      escape both terminators, across the positions attacker data can occupy,
  #      including the separately-implemented group-key path. Verified against
  #      the Go version in go.mod, which is what CI builds with, so a stdlib
  #      regression fails CI rather than passing quietly.
  #
  # What this exclusion does NOT cover, and what these guards do not claim:
  #
  #   * Line-oriented files that are not logs. internal/storage/storage.go's
  #     AppendInventory takes an already-rendered inventory line, parsing it
  #     only to extract the fields it stores; nothing escapes the line on the
  #     way to disk, and inventory.txt is read back with strings.Fields. Its
  #     defence is therefore caller-side validation (ca.ValidateSubject, which
  #     rejects every newline form) rather than escaping at the sink -- and
  #     that covers the CA's own appends only. A migrated inventory does not
  #     come through AppendInventory at all: Migrate copies the whole blob
  #     verbatim as a singleton (migrate.go's migratableSingletons), so it
  #     inherits whatever validation the source CA applied, not this one's.
  #     CodeQL does not model any of this as a log sink and never reported it.
  #   * Operator-facing output that is not slog, carrying values that never
  #     passed ValidateSubject. internal/storage/migrate.go's Logf is written
  #     straight to stderr by the CLI with no escaping, and its key comes from
  #     source directory names, so that call site formats with %q rather than
  #     %s. cmd/openvox-ca-ctl's status table and sign/clean summaries print
  #     names with %s and are deliberately left alone: they render names the
  #     server returns, and quoting them would wreck the column alignment that
  #     is the point of a table. That is a judgement that the operator's own
  #     terminal is not a log pipeline, not an oversight -- revisit it if those
  #     names ever reach something that parses them. Lint catches none of this.
  - exclude:
      id: go/log-injection
