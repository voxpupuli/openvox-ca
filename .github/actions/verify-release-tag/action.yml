name: Verify release tag
description: >
  Gate for v* tag builds, shared by the Release, Container images and Helm
  chart workflows. Verifies that the tag equals "v" + the internal/version
  Version constant (so a release can only be published once the version-bump
  change has landed on the tagged commit), that the Helm chart's version and
  appVersion match it, and that the tagged commit has a passing
  "CI success" check run and is reachable from the default branch (so a
  commit that never went green on main cannot be released). Requires the
  repository to be checked out and the calling workflow to grant
  checks: read.

runs:
  using: composite
  steps:
    - name: Verify tag matches internal/version
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        want="${TAG#v}"
        have="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
        if [ -z "$have" ]; then
          echo "::error::Could not parse the Version constant from internal/version/version.go"
          exit 1
        fi
        if [ "$have" != "$want" ]; then
          echo "::error::Tag $TAG does not match internal/version (Version=\"$have\"). Land a version-bump change setting Version to \"$want\", then re-tag."
          exit 1
        fi
        echo "Tag $TAG matches internal/version"

    - name: Verify the Helm chart version matches
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # The chart is released in lockstep with the binaries: its version is
        # the release version, and its appVersion selects the image tag
        # published for that same release. A chart left at the previous number
        # would either overwrite a published chart or ship pointing at an image
        # that does not exist.
        want="${TAG#v}"
        chart=charts/openvox-ca/Chart.yaml
        version="$(sed -n 's/^version: \(.*\)$/\1/p' "$chart")"
        app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' "$chart")"
        if [ -z "$version" ] || [ -z "$app_version" ]; then
          echo "::error::Could not parse version and appVersion from $chart (appVersion must be double-quoted). Parsed: version=\"$version\" appVersion=\"$app_version\""
          exit 1
        fi
        if [ "$version" != "$want" ] || [ "$app_version" != "$want" ]; then
          echo "::error::$chart does not match tag $TAG (version=\"$version\" appVersion=\"$app_version\"). Land a version-bump change (mage release:prepare $want), then re-tag."
          exit 1
        fi
        echo "Chart version and appVersion match $TAG"

    - name: Verify tagged commit passed CI on the default branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # For an annotated tag GITHUB_SHA can be the tag object rather than
        # the commit it points at, so peel via the checkout (mirroring
        # .lefthook/pre-push/verify-tags.sh).
        sha="$(git rev-parse 'HEAD^{commit}')"

        passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate \
          --jq '[.check_runs[] | select(.name == "CI success" and .conclusion == "success")] | length')"
        if [ "$passed" -lt 1 ]; then
          echo "::error::Commit $sha has no passing 'CI success' check run. Tag a commit that has gone green on main (and wait for CI to finish before tagging)."
          exit 1
        fi
        echo "Commit $sha has a passing 'CI success' check run"

        # A green PR head also carries a passing "CI success" check run, so
        # additionally require the commit to be reachable from the default
        # branch — otherwise a never-merged commit could be released.
        base="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
        status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$sha" --jq .status)"
        case "$status" in
          identical|behind)
            echo "Commit $sha is reachable from $base"
            ;;
          *)
            echo "::error::Commit $sha is not reachable from $base (compare status: $status). Merge the release change, then tag the merged commit."
            exit 1
            ;;
        esac
