name: Verify release tag
description: >
  Gate for v* tag builds, shared by the Release, Container images and Helm
  chart workflows. Verifies that the tag equals "v" + the internal/version
  Version constant (so a release can only be published once the version-bump
  change has landed on the tagged commit), that the Helm chart's version and
  appVersion match it, and that the tagged commit has a passing check run
  for each aggregate main's ruleset requires ("CI success" and "Container
  images success") from a push to the default branch, and is reachable from
  it (so a commit that never went green on main cannot be released, a merged
  PR's head included). Requires the repository to be checked out and the
  calling workflow to grant checks: read (for the check-run lookup),
  actions: read (for the workflow runs that tie them to a push) and
  contents: read (the compare API reads repository contents).

runs:
  using: composite
  steps:
    - name: Verify tag matches internal/version
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        want="${TAG#v}"
        have="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
        if [ -z "$have" ]; then
          echo "::error::Could not parse the Version constant from internal/version/version.go"
          exit 1
        fi
        if [ "$have" != "$want" ]; then
          echo "::error::Tag $TAG does not match internal/version (Version=\"$have\"). Land a version-bump change setting Version to \"$want\", then re-tag."
          exit 1
        fi
        echo "Tag $TAG matches internal/version"

    - name: Verify the Helm chart version matches
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # The chart is released in lockstep with the binaries: its version is
        # the release version, and its appVersion selects the image tag
        # published for that same release. A chart left at the previous number
        # would either overwrite a published chart or ship pointing at an image
        # that does not exist.
        want="${TAG#v}"
        chart=charts/openvox-ca/Chart.yaml
        version="$(sed -n 's/^version: \(.*\)$/\1/p' "$chart")"
        app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' "$chart")"
        if [ -z "$version" ] || [ -z "$app_version" ]; then
          echo "::error::Could not parse version and appVersion from $chart (appVersion must be double-quoted). Parsed: version=\"$version\" appVersion=\"$app_version\""
          exit 1
        fi
        if [ "$version" != "$want" ] || [ "$app_version" != "$want" ]; then
          echo "::error::$chart does not match tag $TAG (version=\"$version\" appVersion=\"$app_version\"). Land a version-bump change (mage release:prepare $want), then re-tag."
          exit 1
        fi
        echo "Chart version and appVersion match $TAG"

    - name: Verify tagged commit passed the required checks on the default branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # For an annotated tag GITHUB_SHA can be the tag object rather than
        # the commit it points at, so peel via the checkout (mirroring
        # .lefthook/pre-push/verify-tags.sh).
        sha="$(git rev-parse 'HEAD^{commit}')"

        # The checks main's ruleset requires, by name. Kept in step with
        # requiredCheckAggregates in magefile.go by a spec that runs this
        # step ("the release tag gate", magefile_release_gate_test.go): it
        # fails if this list omits an aggregate or names one that is not
        # there.
        required=("CI success" "Container images success")

        base="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"

        # Only main's own push runs count. A merged PR's head commit is an
        # ancestor of main and carries passing runs from the PR, but main
        # never built that tree; the tag's own runs are this gate's, still in
        # progress. So collect the check suites of this commit's push runs on
        # the default branch, in this repository rather than a fork. Check
        # suites carry neither the event nor the head repository, which is why
        # this reads workflow runs.
        #
        # --paginate applies --jq to each page separately, so both queries
        # emit one line per item rather than a count; gh refuses --slurp
        # together with --jq, so there is no filter over the whole list.
        if ! runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&branch=$base" --paginate \
          --jq '.workflow_runs[] | select(.event == "push" and .head_repository.id == .repository.id) | "\(.check_suite_id)\t\(.head_branch)"')"; then
          echo "::error::Could not list the workflow runs of commit $sha"
          exit 1
        fi
        main_suites=""
        while IFS=$'\t' read -r suite branch; do
          if [ -n "$suite" ] && [ "$branch" = "$base" ]; then
            main_suites+="$suite"$'\n'
          fi
        done <<<"$runs"
        if [ -z "$main_suites" ]; then
          echo "::error::Commit $sha has no workflow run from a push to $base: $base never built it, so it is most likely a merged PR's head. Tag the merge commit on $base instead (normally the tip of origin/$base)."
          exit 1
        fi

        # Each passing check run, as its check suite and name. filter=all
        # returns every attempt rather than the latest of each name, so a
        # failed re-run of main's workflow cannot hide the attempt that
        # passed. Only GitHub Actions' runs count, as main's ruleset pins each
        # check's source to it: another app could post a check run of the same
        # name.
        if ! checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?filter=all" --paginate \
          --jq '.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions") | "\(.check_suite.id)\t\(.name)"')"; then
          echo "::error::Could not list the check runs of commit $sha"
          exit 1
        fi
        # Here-strings, not pipes: under pipefail, grep -q exiting on the
        # first match can fail printf with SIGPIPE and read as a miss.
        passing=""
        while IFS=$'\t' read -r suite name; do
          if [ -n "$suite" ] && grep -Fxq -- "$suite" <<<"$main_suites"; then
            passing+="$name"$'\n'
          fi
        done <<<"$checks"
        missing=0
        for check in "${required[@]}"; do
          if grep -Fxq -- "$check" <<<"$passing"; then
            echo "Commit $sha has a passing '$check' check run from a push to $base"
          else
            echo "::error::Commit $sha has no passing '$check' check run from a push to $base. If that run is still in progress, re-run this workflow once it passes; the tag can stay. If it failed or was cancelled, tag a commit on $base whose required checks all passed."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

        # A push run on the default branch implies the commit was once its
        # tip; requiring it to be reachable still refuses one that a force
        # push has since removed.
        status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$sha" --jq .status)"
        case "$status" in
          identical|behind)
            echo "Commit $sha is reachable from $base"
            ;;
          *)
            echo "::error::Commit $sha is not reachable from $base (compare status: $status). Merge the release change, then tag the merged commit."
            exit 1
            ;;
        esac
