{{- include "openvox-ca.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvox-ca.fullname" . | quote }}
  namespace: {{ include "openvox-ca.namespace" . | quote }}
  labels:
    {{- include "openvox-ca.labels" . | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.deploymentAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "openvox-ca.selectorLabels" . | nindent 6 }}
  {{- /*
    An unset strategy follows persistence: Recreate has to hold while the cadir
    is a ReadWriteOnce PVC, and has no justification once the state lives in an
    external backend — where keeping it would cost an outage on every upgrade.
  */}}
  {{- $strategy := .Values.strategy }}
  {{- if not $strategy }}
  {{- $strategy = ternary (dict "type" "Recreate") (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxUnavailable" 0 "maxSurge" 1)) .Values.persistence.enabled }}
  {{- else if not $strategy.type }}
  {{- /*
    A strategy map with no type used to be impossible: values.yaml carried
    `type: Recreate` for a partial override to merge onto. Now that it ships
    empty, `--set strategy.rollingUpdate.maxSurge=1` reaches here as a truthy
    map with no type, and Kubernetes reads a typeless strategy as RollingUpdate
    — surging a replacement pod against the ReadWriteOnce cadir this default
    exists to protect. Refuse rather than pick: the two plausible readings
    (roll with these settings / keep Recreate) differ by a CA outage.
  */}}
  {{- fail (printf "strategy is set but has no type: %s. A strategy without an explicit type is treated by Kubernetes as RollingUpdate, which would surge a second pod against the cadir volume. Set strategy.type to RollingUpdate or Recreate, or clear strategy entirely to let it follow persistence.enabled." (toJson $strategy)) }}
  {{- end }}
  strategy:
    {{- toYaml $strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "openvox-ca.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksum := and .Values.configChecksumAnnotation (not .Values.existingConfigMap) }}
      {{- if or $checksum .Values.podAnnotations .Values.commonAnnotations }}
      annotations:
        {{- if $checksum }}
        checksum/config: {{ include "openvox-ca.configMapData" . | sha256sum | quote }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "openvox-ca.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ include "openvox-ca.automountServiceAccountToken" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . | quote }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      {{- /*
        A constraint with no labelSelector matches every pod in the namespace,
        which is never what you want here — default it to this release's own
        pods.
      */}}
      {{- $selector := dict "matchLabels" (include "openvox-ca.selectorLabels" . | fromYaml) }}
      {{- $constraints := list }}
      {{- range .Values.topologySpreadConstraints }}
      {{- $c := deepCopy . }}
      {{- if not $c.labelSelector }}
      {{- $_ := set $c "labelSelector" $selector }}
      {{- end }}
      {{- $constraints = append $constraints $c }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name | quote }}
          image: {{ include "openvox-ca.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if .Values.args }}
            {{- toYaml .Values.args | nindent 12 }}
            {{- else }}
            {{- /*
              --config is passed explicitly rather than relying on
              auto-detection so that the image's own CMD (which hard-codes a
              --cadir) is always replaced.
            */}}
            - {{ printf "--config=%s" (include "openvox-ca.configFilePath" .) | quote }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if or .Values.env .Values.extraEnv }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.livenessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.readinessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.startupProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            - name: config
              mountPath: {{ .Values.configMount | quote }}
              readOnly: true
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.ca.existingSecret }}
            - name: ca
              mountPath: {{ .Values.ca.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.caKeyPassphrase.existingSecret }}
            - name: ca-key-passphrase
              mountPath: {{ .Values.caKeyPassphrase.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "openvox-ca.pvcName" . | quote }}
          {{- else if or .Values.emptyDir.medium .Values.emptyDir.sizeLimit }}
          emptyDir:
            {{- with .Values.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with .Values.emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
          {{- else }}
          {{- /* Both cleared: node-backed disk with no size limit. */}}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "openvox-ca.configMapName" . | quote }}
        {{- /*
          The three key-material volumes below are all mode 0600. Combined with
          the pod's fsGroup the kubelet ORs group access in, so the container
          user can read them and nothing else can. The comment sits here rather
          than between secretName and defaultMode so that chart:test can assert
          the two as one contiguous string.
        */}}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
            defaultMode: 0600
        {{- end }}
        {{- if .Values.ca.existingSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.ca.existingSecret | quote }}
            defaultMode: 0600
        {{- end }}
        {{- if .Values.caKeyPassphrase.existingSecret }}
        - name: ca-key-passphrase
          secret:
            secretName: {{ .Values.caKeyPassphrase.existingSecret | quote }}
            defaultMode: 0600
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
