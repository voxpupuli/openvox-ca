{{- include "openvox-ca.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvox-ca.fullname" . }}
  namespace: {{ include "openvox-ca.namespace" . }}
  labels:
    {{- include "openvox-ca.labels" . | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.deploymentAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "openvox-ca.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "openvox-ca.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksum := and .Values.configChecksumAnnotation (not .Values.existingConfigMap) }}
      {{- if or $checksum .Values.podAnnotations .Values.commonAnnotations }}
      annotations:
        {{- if $checksum }}
        checksum/config: {{ include "openvox-ca.configMapData" . | sha256sum }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "openvox-ca.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "openvox-ca.automountServiceAccountToken" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      {{- /*
        A constraint with no labelSelector matches every pod in the namespace,
        which is never what you want here — default it to this release's own
        pods.
      */}}
      {{- $selector := dict "matchLabels" (include "openvox-ca.selectorLabels" . | fromYaml) }}
      {{- $constraints := list }}
      {{- range .Values.topologySpreadConstraints }}
      {{- $c := deepCopy . }}
      {{- if not $c.labelSelector }}
      {{- $_ := set $c "labelSelector" $selector }}
      {{- end }}
      {{- $constraints = append $constraints $c }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "openvox-ca.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if .Values.args }}
            {{- toYaml .Values.args | nindent 12 }}
            {{- else }}
            {{- /*
              --config is passed explicitly rather than relying on
              auto-detection so that the image's own CMD (which hard-codes a
              --cadir) is always replaced.
            */}}
            - --config={{ include "openvox-ca.configFilePath" . }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if or .Values.env .Values.extraEnv }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.livenessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.readinessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "openvox-ca.probe" (dict "probe" .Values.startupProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: {{ .Values.configMount }}
              readOnly: true
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.ca.existingSecret }}
            - name: ca
              mountPath: {{ .Values.ca.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.caKeyPassphrase.existingSecret }}
            - name: ca-key-passphrase
              mountPath: {{ .Values.caKeyPassphrase.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "openvox-ca.pvcName" . }}
          {{- else if or .Values.emptyDir.medium .Values.emptyDir.sizeLimit }}
          emptyDir:
            {{- with .Values.emptyDir.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with .Values.emptyDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- else }}
          {{- /* Both cleared: node-backed disk with no size limit. */}}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "openvox-ca.configMapName" . }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            # 0600 plus the pod's fsGroup: the kubelet ORs group access in when
            # fsGroup is set, so the container user can read it and nothing
            # else can.
            defaultMode: 0600
        {{- end }}
        {{- if .Values.ca.existingSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.ca.existingSecret }}
            defaultMode: 0600
        {{- end }}
        {{- if .Values.caKeyPassphrase.existingSecret }}
        - name: ca-key-passphrase
          secret:
            secretName: {{ .Values.caKeyPassphrase.existingSecret }}
            defaultMode: 0600
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
