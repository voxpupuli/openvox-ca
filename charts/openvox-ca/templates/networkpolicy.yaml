{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openvox-ca.fullname" . }}
  namespace: {{ include "openvox-ca.namespace" . }}
  labels:
    {{- include "openvox-ca.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "openvox-ca.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  {{- /*
    An empty `ingress:` key is a null value, not an empty list; spell the
    deny-all case out so `apiAccess: none` with no other rules stays valid.
  */}}
  {{- if and (eq .Values.networkPolicy.apiAccess "none") (not .Values.networkPolicy.extraIngress) (not (and .Values.metrics.enabled .Values.networkPolicy.metricsNamespaces)) }}
  ingress: []
  {{- else }}
  ingress:
    {{- if eq .Values.networkPolicy.apiAccess "any" }}
    {{- /*
      Puppet agents can live in any namespace, so the API port admits the whole
      cluster by default. Narrow it with apiAccess: namespace or none.
    */}}
    - from:
        - podSelector: {}
          namespaceSelector: {}
      ports:
        - port: https
          protocol: TCP
    {{- else if eq .Values.networkPolicy.apiAccess "namespace" }}
    - from:
        - podSelector: {}
      ports:
        - port: https
          protocol: TCP
    {{- end }}
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsNamespaces }}
    {{- /*
      Leaf-certificate metrics carry node hostnames as label values, so the
      exporter is only reachable from the monitoring namespaces.
    */}}
    - from:
        {{- range .Values.networkPolicy.metricsNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS is always needed: the CA resolves its storage backend, OpenBao, and
    # the Kubernetes API by name.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress.rules }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
