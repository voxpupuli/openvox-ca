{{- if .Values.ingress.enabled }}
{{- $backend := include "openvox-ca.routeBackendName" (dict "backendPort" .Values.ingress.backendPort "root" $) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openvox-ca.fullname" . | quote }}
  namespace: {{ include "openvox-ca.namespace" . | quote }}
  labels:
    {{- include "openvox-ca.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.commonAnnotations .Values.ingress.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" | quote }}
            backend:
              service:
                name: {{ include "openvox-ca.fullname" $ | quote }}
                port:
                  name: {{ $backend | quote }}
          {{- end }}
    {{- end }}
{{- end }}
