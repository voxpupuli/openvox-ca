{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openvox-ca.serviceAccountName" . }}
  namespace: {{ include "openvox-ca.namespace" . }}
  labels:
    {{- include "openvox-ca.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.commonAnnotations .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# The token is mounted on the pod rather than defaulted here, so that turning
# Kubernetes export off stops mounting it without recreating the account.
automountServiceAccountToken: false
{{- end }}
