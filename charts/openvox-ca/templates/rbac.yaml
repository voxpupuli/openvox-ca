{{/*
Gated on exportRBACRendered — export configured by either route the server
honours, and rbac.create. Not on kubernetesExport.enabled alone: targets set
straight into config.kubernetes_export configure the exporter just as well, and
gating on the flag left that route with a mounted token, a NOTE naming export as
the reason, and no Role at all — the exporter refused by RBAC while readiness
stayed green. Every refusal and NOTES warning about the export grant — the
default-ServiceAccount and cluster-wide-create refusals in openvox-ca.validate,
and the cluster-wide and unnarrowable-grant warnings in openvox-ca.notes — reads
the same helper, so they all agree on when this file renders.
*/}}
{{- if eq (include "openvox-ca.exportRBACRendered" .) "true" }}
{{- $fullName := include "openvox-ca.fullname" . }}
{{- $namespace := include "openvox-ca.namespace" . }}
{{- $labels := include "openvox-ca.labels" . }}
{{- $serviceAccount := include "openvox-ca.serviceAccountName" . }}
{{- $cluster := eq .Values.kubernetesExport.rbac.scope "ClusterRole" }}
{{/*
The exporter only ever creates or server-side-applies its targets — it never
reads them back — so create and patch are the whole permission set.
*/}}
{{- if $cluster }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-export" $fullName | quote }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "openvox-ca.exportRules" $ | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-export" $fullName | quote }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-export" $fullName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount | quote }}
    namespace: {{ $namespace | quote }}
{{- else }}
{{/*
One Role/RoleBinding pair per namespace exported into: the release namespace,
plus whatever rbac.namespaces lists.
*/}}
{{- range $ns := prepend .Values.kubernetesExport.rbac.namespaces $namespace | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-export" $fullName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "openvox-ca.exportRules" $ | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-export" $fullName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-export" $fullName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount | quote }}
    namespace: {{ $namespace | quote }}
{{- end }}
{{- end }}
{{- end }}
