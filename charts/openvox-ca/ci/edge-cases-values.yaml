# The branches no other fixture reaches. Not a coherent deployment — its job is
# to make sure that every documented value has at least one rendering behind it,
# which is the rule AGENTS.md states and which several of these branches were
# quietly failing before.
#
# Two documented values are deliberately covered by a chart:test render
# assertion rather than here, because what matters about them is a rendered
# string rather than schema validity: `emptyDir` with both fields cleared (the
# volume source must not go null) and `backendPort: metrics` (the Ingress must
# get the port name, the Gateway routes the number).
#
# The LoadBalancer-only Service values are covered by full-values.yaml, which
# uses that Service type; this fixture uses NodePort.

fullnameOverride: ca-edge

# A terminating proxy in front: plain HTTP, so the probes must follow suit.
#
# An external backend, because the autoscaler below may run four replicas and
# the chart refuses that on filesystem or sqlite. Spelled by its alias, so the
# fixture also proves the refusal folds aliases onto the right kind.
config:
  no_tls_required: true
  storage_backend: valkey
  redis_addrs:
    - valkey.ca-edge.svc:6379

# Node-backed disk with an explicit cap: medium cleared, sizeLimit set. (The
# both-cleared case is a chart:test render assertion rather than a fixture,
# since it is about the volume source not going null.)
persistence:
  enabled: false
  retain: false
emptyDir:
  medium: ""
  sizeLimit: 256Mi

podLabels:
  example.com/tier: pki

# The raw autosign setting rather than the rendered allowlist.
autosign:
  mode: "false"

# Forced on despite nothing needing the API.
automountServiceAccountToken: true

extraArgs:
  - --csr-rate-limit=120

imagePullSecrets:
  - name: ghcr-pull

# The metrics exporter is on so that metricsNodePort has something to attach
# to, and so the ServiceMonitor pass-throughs below have a port to scrape.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    jobLabel: app.kubernetes.io/name
    targetLabels:
      - app.kubernetes.io/part-of
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node

service:
  type: NodePort
  nodePort: 30140
  metricsNodePort: 30914
  publishNotReadyAddresses: true
  clusterIP: 10.96.0.42
  externalIPs:
    - 192.0.2.20

podDisruptionBudget:
  enabled: true
  maxUnavailable: 0

networkPolicy:
  enabled: true
  apiAccess: none
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: puppet
      ports:
        - port: https
          protocol: TCP

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: ""
  metrics:
    - type: Pods
      pods:
        metric:
          name: openvoxca_http_requests_in_flight
        target:
          type: AverageValue
          averageValue: "10"
